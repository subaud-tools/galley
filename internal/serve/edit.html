<!doctype html>
<!--
  The edit-mode shell. Deliberately almost empty: it names the document, gives
  the editor bundle somewhere to mount, and offers the one control that does
  not belong to the editor (Revise). Every piece of editing logic lives in
  /_galley/editor.js, built by `just assets`, which also moves this markup into
  the kit's frame (web/shell.ts).

  {{.Title}} and {{.Room}} are filled by html/template, which escapes both for
  the context they land in — so a document called `weird".md` cannot break out
  of an attribute.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="{{.Base}}/">
<title>{{.Title}} — galley</title>
<link rel="icon" type="image/svg+xml" href="{{.Base}}/_galley/favicon.svg">
<script src="/_kit/boot.js" data-tool="galley"></script>
<link rel="stylesheet" href="/_kit/kit.css">
<link rel="stylesheet" href="{{.Base}}/_galley/editor.css">
<style>
  /* The shell's own chrome only. The document's typography is editor.css's
     business; these are the few rules that must hold even if the bundle has
     not been built yet, so an unbuilt checkout still renders a legible page
     with a readable error rather than white-on-white.

     AND IT IS A SECOND HAND-KEPT COPY OF editor.css'S `:root`, WHICH IS A
     KNOWN COST AND NOT A TIDY ONE. See the paragraph at the head of
     web/editor.css: the two blocks agree today and nothing but a person keeps
     them agreeing, and the TOP BAR being authored in both files has already
     produced four rules that exist only to win source-order ties. The fix is
     to GENERATE this block from editor.css's tokens at build time rather than
     to delete either copy — this one has to survive editor.css not having
     loaded, which is the whole reason it is here. Anything added to
     editor.css's `:root` is added here in the same commit until then. */
  :root {
    color-scheme: light dark;
    --gly-bg: #f4f5f8;
    --gly-fg: #1a1d27;
    --gly-muted: #59606f;
    --gly-line: #e3e5ec;
    --gly-accent: #b06f14;
    /* THE ACTION COLOUR, and it is galley's own — site/style.css's --signal,
       the same value web/editor.css imports. The one filled control on this
       page is filled with it. Kept in step with editor.css's :root by hand:
       these are the values that file expects to find, and a shell that
       declares a different --gly-signal renders an unbuilt checkout in a
       colour the built one never uses. */
    --gly-signal: #146e85;
    --gly-signal-ink: #ffffff;
    /* ONE ELEVATION AND ONE INSTRUCTION INK, in step with editor.css's :root
       for the reason the note above gives. Nothing in the shell's own markup
       floats or is filled with --gly-hl, so neither is read on an unbuilt
       page — they are here because this block's contract is that it declares
       what editor.css declares, and a token that exists in one of the two is
       the drift this comment exists to prevent. */
    --gly-lift: 0 6px 22px rgba(0, 0, 0, 0.16);
    --gly-hl-ink: #ffffff;
    /* The brand mark's own amber — see internal/serve/assets/favicon.svg and
       site/index.html's inline logo. Deliberately a separate token from
       --gly-accent: the accent is this surface's interactive colour and has
       already drifted from the brand value in dark mode (#eba63f), while the
       mark is the same two hex codes wherever it renders. */
    --gly-mark-amber: #b06f14;
    --gly-mono: "SF Mono", ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --gly-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --gly-bg: #14161d;
      --gly-fg: #e8eaf1;
      --gly-muted: #969cae;
      --gly-line: #2b2f3b;
      --gly-accent: #eba63f;
      --gly-signal: #5fb6c9;
      --gly-signal-ink: #10141b;
      --gly-hl-ink: #10141b;
      --gly-mark-amber: #d08b1f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--gly-bg);
    color: var(--gly-fg);
    font: 16px/1.6 var(--gly-sans);
  }
  :where(body, .kit-card-body) > main { max-width: 46rem; margin: 0 auto; padding: 32px 20px 40vh; }
</style>
</head>
<body>
<div class="kit-page"><div id="app" class="kit-app"></div></div>
<main>
  <div id="editor" data-room="{{.Room}}" data-doc="{{.Title}}" data-page-mode="{{if .PageMode}}1{{end}}" data-preview="{{.PreviewURL}}" data-can-share="{{if .CanShare}}1{{end}}"></div>
</main>
<script type="module" src="{{.Base}}/_galley/editor.js"></script>
<script>
(function () {
  var mount = document.getElementById('editor');
  var room = mount.getAttribute('data-room');

  window.addEventListener('load', function () {
    if (window.galleyEdit && typeof window.galleyEdit.init === 'function') {
      window.galleyEdit.init({ room: room });
      return;
    }
    mount.textContent = 'editor bundle missing — run `just assets`';
  });
})();
</script>
</body>
</html>
